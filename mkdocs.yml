site_name: Arch 排错笔记
site_description: 混合显卡 + niri 的排错笔记：跨卡合成、频率过低、Chrome 硬解
site_author: KiritoLV
repo_url: https://github.com/KiritoLV/arch-linux-guide
repo_name: KiritoLV/arch-linux-guide
copyright: MIT License

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle: {icon: material/weather-sunny, name: 浅色}
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle: {icon: material/weather-night, name: 深色}
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - 首页: index.md
  - 显卡:
      - "第一类：跨卡合成 —— 闪屏 / 撕裂 / 残影 / 单帧花屏": 显卡/01-跨卡合成-闪屏撕裂卡顿花屏.md
      - "第二类：静默偶发卡顿 —— 频率太低（锁频解决）": 显卡/02-静默偶发卡顿-频率太低.md
  - Chrome:
      - "Chrome 在 NVIDIA 上根本不会硬解：独显直连就换 Firefox，有核显才指定核显": Chrome/01-Chrome不支持NVIDIA硬解-用Firefox或核显.md
  - 存储:
      - "NTFS 大文件读到一半 EIO、目录读到某个 inode 就中断": 存储/01-NTFS读到一半EIO.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}

plugins:
  - search
